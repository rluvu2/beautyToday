<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상 보기 - 웃긴 순간</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <div class="container" style="text-align: center;">
    <h1>여러가지 팩 장단점</h1>
    <a href="http://phaeton.firestick.live/media/4408/src.mp4" target="_blank">
      <img src="https://img.youtube.com/vi/6soPMWrJiNc/0.jpg" alt="여러가지 팩 장단점" style="border-radius:8px; margin-bottom:24px;">
    </a>
    <button id="make-highlight" style="margin-bottom:24px;">하이라이트 만들기</button>
    <div id="highlight-list" style="margin-bottom:24px;"></div>
    <p>여러가지 팩의 장단점을 비교하는 영상입니다.</p>
    <a href="main.html" class="button">메인으로 돌아가기</a>
    <script>
      document.getElementById('make-highlight').onclick = function() {
        const highlights = [
          { label: '하이라이트1', time: '0~2초', url: 'http://phaeton.firestick.live/media/4408/highlighting/cut0.mp4' },
          { label: '하이라이트2', time: '0~2초', url: 'http://phaeton.firestick.live/media/4408/highlighting/cut1.mp4' },
          { label: '하이라이트3', time: '0~2초', url: 'http://phaeton.firestick.live/media/4408/highlighting/cut2.mp4' }
        ];
        const list = document.getElementById('highlight-list');
        list.innerHTML = '';
        let i = 0;
        function showNext() {
          if (i < highlights.length) {
            const h = highlights[i];
            const item = document.createElement('div');
            item.style.fontSize = '1.2rem';
            item.style.margin = '8px 0';
            item.innerHTML = `<strong>${h.label}</strong> <span style="color:#888;">(${h.time})</span> <a href="${h.url}" target="_blank" style="margin-left:8px;">cut${i}</a>`;
            list.appendChild(item);
            i++;
            setTimeout(showNext, 700);
          }
        }
        showNext();
      };
    </script>
  </div>
</body>
</html>
